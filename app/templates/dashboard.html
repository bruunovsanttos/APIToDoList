<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - To Do list</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <header>
            <h1>Minhas Tarefas</h1>
            <p id="subtitulo">Organize suas atividades e acompanhe sua rotina.</p> 
            <button type="button" id="logout">Sair</button>
        </header>

        <section>
            <fieldset> 
                <legend><strong>Crie uma nova tarefa</strong></legend>
                <form id="task-form">
                    <div>
                        <label for="title">Título da tarefa:</label>
                        <input type="text" name="title" id="title" maxlength="50" required>
                    </div>
                    <div>
                        <label for="description">Descrição:</label>
                        <textarea name="description" id="description" maxlength="500" required></textarea>
                    </div>
                    <button type="submit">Adicionar tarefa</button>

            </form>
            </fieldset>
            
        </section>
        <section>
            <fieldset> 
                <legend><strong>Minhas Tarefas</strong></legend>
                <div id="tasks-list">
                    <p>nenhuma tarefa carregada ainda.</p>
                </div>
            </fieldset>
                        
        </section>




    </main>


<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>    
</body>
</html>
